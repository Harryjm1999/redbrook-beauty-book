# Xcode project definition for the Redbrook Clinic iOS app.
# Generate Redbrook.xcodeproj with:  brew install xcodegen && xcodegen generate
name: Redbrook
options:
  bundleIdPrefix: uk.co.redbrookclinic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.1

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  Redbrook:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Redbrook
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.redbrookclinic.app
        PRODUCT_NAME: Redbrook
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: Redbrook/Info.plist
      properties:
        CFBundleDisplayName: Redbrook Clinic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Jost-Light.ttf
          - Jost-Regular.ttf
          - Jost-Medium.ttf
          - CormorantGaramond-Light.ttf
          - CormorantGaramond-Regular.ttf
          - CormorantGaramond-Medium.ttf
