<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Returning to Redbrook Clinic</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f3ee;
        color: #3a3632;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <!--
      Google and Apple sign in for the iOS app. The app opens the Lovable sign-in
      broker with this page as the return address, and this page hands the result
      (tokens or an error, in the query or the #fragment) back to the app.
    -->
    <p>Returning to the Redbrook Clinic app… <br /><a id="back" href="redbrook://oauth-callback">Tap here if nothing happens</a></p>
    <script>
      var target = "redbrook://oauth-callback" + window.location.search + window.location.hash;
      document.getElementById("back").href = target;
      window.location.replace(target);
    </script>
  </body>
</html>
