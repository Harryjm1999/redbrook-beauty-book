<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Opening Redbrook Clinic</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f0e8;
        color: #3a3632;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
        line-height: 1.5;
      }
      a.button {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 22px;
        background: #6f7a63;
        color: #fff;
        text-decoration: none;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <!--
      Confirm-email and reset-password links for people who signed up in the iOS
      app land here. This page opens the app (redbrook://auth-callback) with the
      sign-in details from the link, and the app signs them in.
    -->
    <main>
      <p id="message">Opening the Redbrook Clinic app…</p>
      <a id="open" class="button" href="redbrook://auth-callback">Open the app</a>
    </main>
    <script>
      var params = new URLSearchParams(window.location.search);
      var target = "redbrook://auth-callback" + window.location.search + window.location.hash;
      document.getElementById("open").href = target;
      if (params.get("next") === "reset") {
        document.getElementById("message").textContent =
          "Opening the Redbrook Clinic app so you can choose a new password. If nothing happens, open this link on the iPhone that has the app.";
      } else {
        document.getElementById("message").textContent =
          "Your email is confirmed. Opening the Redbrook Clinic app… If nothing happens, open the app and sign in.";
      }
      window.location.replace(target);
    </script>
  </body>
</html>
