name: iOS build

# Compiles the native iOS app in ios/ for the simulator (no signing) so code
# changes are checked on a Mac. Runs only when the iOS app changes.
on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          status=0
          xcodebuild \
            -project Redbrook.xcodeproj \
            -scheme Redbrook \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || status=$?
          grep -E "error:" build.log | sort -u || true
          tail -n 40 build.log
          exit $status
