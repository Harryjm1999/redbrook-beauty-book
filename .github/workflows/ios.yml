name: iOS build

# Compiles the native iOS app in ios/ for the simulator (no signing) so code
# changes are checked on a Mac. Runs only when the iOS app changes.
on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          status=0
          xcodebuild \
            -project Redbrook.xcodeproj \
            -scheme Redbrook \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || status=$?
          grep -E "error:" build.log | sort -u || true
          tail -n 40 build.log
          exit $status

  # Runs the app in an iPhone 16 Pro Max simulator, screenshots each screen and
  # pushes them to the `ios-screenshots` branch so they can be reviewed (and used
  # for the App Store's 6.9" screenshots, which are exactly this size).
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          status=0
          xcodebuild \
            -project Redbrook.xcodeproj \
            -scheme Redbrook \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || status=$?
          grep -E "error:" build.log | sort -u || true
          tail -n 5 build.log
          exit $status
      - name: Take screenshots
        run: |
          set -x
          xcrun simctl boot "iPhone 16 Pro Max" || true
          xcrun simctl bootstatus "iPhone 16 Pro Max" -b
          xcrun simctl status_bar booted override --time "9:41" --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install booted build/Build/Products/Debug-iphonesimulator/Redbrook.app
          mkdir -p shots
          for screen in home treatments book appointments more about contact privacy records; do
            xcrun simctl terminate booted uk.co.redbrookclinic.app || true
            xcrun simctl launch booted uk.co.redbrookclinic.app -screen "$screen"
            sleep 12
            xcrun simctl io booted screenshot "shots/$screen.png"
          done
          ls -la shots
      - name: Publish screenshots to the ios-screenshots branch
        run: |
          cd shots
          git init -q -b ios-screenshots
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -q -m "Screenshots from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-screenshots
